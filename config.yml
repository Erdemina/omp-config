setupVersion: 2
modelRoles:
  orchestrator: anthropic/claude-opus-5-5:low
  plan: anthropic/claude-opus-5-5:low
  slow: openai-codex/gpt-6-sol
  task: anthropic/claude-sonnet-5-5:low
  smol: anthropic/claude-haiku-4-5:low
  tiny: anthropic/claude-haiku-4-5:low
  commit: anthropic/claude-haiku-4-5:low
  advisor: anthropic/claude-sonnet-5-5:low
  vision: anthropic/claude-sonnet-5-5:low
  default: openai-codex/gpt-6-astra
cycleOrder:
  - default
  - smol
  - slow
defaultThinkingLevel: minimal
hideThinkingBlock: false
retry:
  modelFallback: false
  usageAwareFallback: false
  fallbackRevertPolicy: never
enabledProviders:
  - openai-codex
  - anthropic
task:
  enableEffort: true
  maxConcurrency: 2
  maxRuntimeMs: 2700000
  softRequestBudget: 80
  showResolvedModelBadge: true
  agentModelOverrides:
    task: "@task"
    scout: "@task"
    sonic: "@smol"
compaction:
  idleEnabled: true
  idleTimeoutSeconds: 3600
recap:
  enabled: false
dev:
  autoqaConsent: granted
codexResets:
  autoRedeem: "yes"